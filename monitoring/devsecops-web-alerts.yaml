apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devsecops-web-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: devsecops-web.rules
      rules:
        - alert: DevSecOpsWebDown
          expr: probe_success{job="devsecops-web-http"} == 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "DevSecOps web application is down"
            description: "The HTTP health check has failed for at least one minute."
