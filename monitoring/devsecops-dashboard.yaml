apiVersion: v1
kind: ConfigMap
metadata:
  name: devsecops-web-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  devsecops-web-dashboard.json: |-
    {
      "uid": "devsecops-web",
      "title": "DevSecOps Web App Monitoring",
      "tags": ["devsecops", "kubernetes", "monitoring"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready Web Pods",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"default\",pod=~\"devsecops-web.*\",condition=\"true\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Desired Replicas",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_deployment_spec_replicas{namespace=\"default\",deployment=\"devsecops-web\"}",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Pod Readiness Over Time",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_pod_status_ready{namespace=\"default\",pod=~\"devsecops-web.*\",condition=\"true\"}",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 5
          }
        }
      ]
    }
