apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: devsecops-web-http
  namespace: monitoring
  labels:
    release: monitoring
spec:
  jobName: devsecops-web-http
  interval: 15s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://devsecops-web.default.svc.cluster.local
